<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>poche resend webmail</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Apply the stored theme before first paint, otherwise a light-theme user
    // gets a dark flash on every load.
    (function () {
      try {
        var t = localStorage.getItem('webmail_theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          // Colours resolve through CSS variables so one palette swap flips the
          // whole UI; the <alpha-value> form keeps modifiers like bg-paper/40.
          colors: {
            ink: {
              DEFAULT: 'rgb(var(--ink) / <alpha-value>)',
              muted: 'rgb(var(--ink-muted) / <alpha-value>)',
              dim: 'rgb(var(--ink-dim) / <alpha-value>)',
            },
            paper: {
              DEFAULT: 'rgb(var(--paper) / <alpha-value>)',
              raised: 'rgb(var(--paper-raised) / <alpha-value>)',
              line: 'rgb(var(--paper-line) / <alpha-value>)',
            },
            accent: {
              DEFAULT: 'rgb(var(--accent) / <alpha-value>)',
              soft: 'rgb(var(--accent) / 0.14)',
            },
          },
          fontFamily: {
            display: ['"Iowan Old Style"', 'Palatino', 'Georgia', 'ui-serif', 'serif'],
            sans: ['"Segoe UI"', 'system-ui', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-paper text-ink font-sans antialiased">
  <div id="root"></div>
  <script type="text/babel" src="/js/api.jsx"></script>
  <script type="text/babel" src="/js/components-pane.jsx"></script>
  <script type="text/babel" src="/js/components-compose.jsx"></script>
  <script type="text/babel" src="/js/components.jsx"></script>
  <script type="text/babel" src="/js/app-login.jsx"></script>
  <script type="text/babel" src="/js/app-layout.jsx"></script>
  <script type="text/babel" src="/js/app.jsx"></script>
</body>
</html>
